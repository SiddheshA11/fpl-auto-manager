name: FPL Auto Manager - Deadline Check

# MANUAL ONLY. This is not currently a safety net and nothing triggers it.
#
# It was written to be dispatched by scheduler.yml ~2 hours before the
# deadline. scheduler.yml has been disabled_inactivity since April 2026, so
# this workflow has not run on its own for months and nothing noticed - it is
# layer two of the three that failed silently when the GW2 deadline passed
# unattended on 2026-08-28.
#
# The live deadline safety net is now watchdog.yml, which watches the outcome
# (was a team submitted for the next gameweek?) rather than the cron, on its
# own schedule. What this file still does that the watchdog does not is re-read
# availability and repair the lineup after late team news. Rewiring it onto a
# schedule of its own is the obvious next step; until that happens, do not
# treat its existence as coverage.
#
# Acts as a safety net to catch last-minute injury news

on:
  workflow_dispatch:

jobs:
  deadline-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # See weekly_run.yml: priors are gitignored, so they must be fetched
      # before the model can score anything.
      - name: Cache historical dataset
        uses: actions/cache@v4
        with:
          path: data/history
          key: fpl-history-${{ hashFiles('fetch_data.py') }}-v1

      - name: Fetch priors
        run: python fetch_data.py --skip-live

      - name: Run deadline check
        env:
          FPL_EMAIL: ${{ secrets.FPL_EMAIL }}
          FPL_PASSWORD: ${{ secrets.FPL_PASSWORD }}
          FPL_TEAM_ID: ${{ secrets.FPL_TEAM_ID }}
          FPL_COOKIE: ${{ secrets.FPL_COOKIE }}
          FPL_REFRESH_TOKEN: ${{ secrets.FPL_REFRESH_TOKEN }}
          # Required for token rotation. Without these this run consumes a
          # refresh token and cannot persist the replacement, which breaks
          # authentication for every run after it.
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python deadline_check.py

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deadline-check-logs-${{ github.run_number }}
          # deadline_check.py writes fpl_deadline_*.log; matching only
          # fpl_run_*.log uploaded an empty artifact and left the one run whose
          # output matters most with no record of what it changed.
          path: |
            fpl_deadline_*.log
            fpl_run_*.log
          retention-days: 14
