name: FPL Auto Manager - Weekly Run

on:
  # Hourly. manager.py acts only inside a 2-6h window before the deadline, and
  # the gate job below decides that in a few seconds without installing
  # anything or logging in, so the other ~20 ticks a day are nearly free.
  #
  # This was '0 10 * * 5', then '0 10 * * *'. The daily version fixed coverage
  # of the five Wednesday midweek rounds and left a subtler hole: a 24h-wide
  # window sampled every 24h admits exactly ONE qualifying tick per gameweek,
  # for all 38, so there was no retry. On 2026-08-28 that one tick did not fire
  # and a run appeared at 21:02, three and a half hours after the GW2 deadline.
  #
  # Widening the window instead of the sampling would have been worse: a
  # 6-hourly cron on the old 2-26h band gives four ticks but the first one
  # acts, at a lead of 22.0-25.5h, deciding every week on day-old team news.
  # Hourly on a 2-6h band gives four qualifying ticks for every one of the 38
  # gameweeks, the acting tick at a lead of 5.0-5.5h, three spares behind it.
  # The FPL_LAST_SUBMITTED_GW marker is what stops the spares resubmitting.
  schedule:
    - cron: '0 * * * *'
  # Manual trigger still available for testing. A dispatch deliberately skips
  # the window and the marker: it is an explicit act, and it is also how the
  # watchdog remediates a gameweek nothing else has submitted.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no changes submitted to FPL)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  # Costs a few seconds and touches no credentials. Everything below it - the
  # dependency install, the priors fetch, and above all the FPL login - is
  # skipped on the ~20 hourly ticks a day that have nothing to do. That last
  # point is not an optimisation: the FPL refresh token is single-use and
  # rotates on login, so an hourly job that authenticated before checking the
  # date would burn 24 rotations a day for one useful run.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          # Interpolated by GitHub from the repository variable manager.py
          # writes after a successful submission. Empty when unset.
          LAST_SUBMITTED_GW: ${{ vars.FPL_LAST_SUBMITTED_GW }}
        run: python3 deadline_state.py

  manage-team:
    needs: gate
    # Fails OPEN, deliberately. `needs: gate` alone would skip this job
    # whenever the gate errored, so a crash in a cheap optimisation step
    # would silently cost a gameweek - the same class of failure as the dead
    # scheduler this whole rework exists to remove. This runs unless the gate
    # said 'false' explicitly, and always() is required or a failed
    # dependency skips the job before the `if` is ever evaluated.
    #
    # Safe because the gate does not enforce the window: manager.py
    # re-checks the deadline and the submission marker itself under
    # --respect-window, and a run that arrives here out of window exits 0
    # having done nothing. The gate exists to avoid 20-odd needless FPL
    # logins a day against a single-use rotating token, not to be correct.
    #
    # A manual dispatch is a deliberate act and runs whatever the gate says;
    # that is also the path the watchdog uses to remediate a missed gameweek.
    if: >-
      always() &&
      (github.event_name != 'schedule' || needs.gate.outputs.should_run != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Printed on every run because the model's output depends on these more
      # than it looks: a pandas major bump silently changed how a text column
      # reports its dtype and halved the squad's expected points.
      - name: Record resolved versions
        run: pip list --format=freeze | grep -iE '^(pandas|numpy|scipy|requests|pynacl)=='

      # The historical dataset the xP model builds its priors from is
      # gitignored (12MB, reproducible), so a fresh checkout has none. Without
      # this step every per-90 rate falls back to zero and the run would submit
      # a squad chosen by nothing. manager.py refuses to run on empty priors,
      # so a fetch failure surfaces as a failed run rather than a bad team.
      - name: Cache historical dataset
        uses: actions/cache@v4
        with:
          path: data/history
          key: fpl-history-${{ hashFiles('fetch_data.py') }}-v1

      - name: Fetch priors and snapshot live data
        run: python fetch_data.py

      - name: Run FPL Auto Manager
        env:
          FPL_EMAIL: ${{ secrets.FPL_EMAIL }}
          FPL_PASSWORD: ${{ secrets.FPL_PASSWORD }}
          FPL_TEAM_ID: ${{ secrets.FPL_TEAM_ID }}
          FPL_COOKIE: ${{ secrets.FPL_COOKIE }}
          FPL_REFRESH_TOKEN: ${{ secrets.FPL_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          # --respect-window on the schedule only. It re-checks the window and
          # the marker inside manager.py rather than trusting the gate: the
          # gate runs minutes earlier in its own job, and a run that submits a
          # second team because two jobs disagreed is worse than one that
          # skips. A manual dispatch is deliberate and always acts.
          WINDOW=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            WINDOW="--respect-window"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python manager.py --dry-run $WINDOW
          else
            python manager.py $WINDOW
          fi

      - name: Report a failed run
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 -c "
          import os, notify
          notify.from_env().send(
              '*FPL weekly run failed*\n\nThe run reached the acting window and did '
              'not finish. The watchdog will retry, but check this.\n\n' + os.environ['RUN_URL'])
          "

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpl-run-logs-${{ github.run_number }}
          path: fpl_run_*.log
          retention-days: 30
