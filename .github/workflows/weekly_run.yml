name: FPL Auto Manager - Weekly Run

on:
  # Daily at 10:00 UTC. manager.py decides whether today is the day by checking
  # the real deadline - see DEADLINE_WINDOW_MIN/MAX.
  #
  # This was '0 10 * * 5'. Deadlines are not weekly: across 2026-27 they fall on
  # Sat 26 times, Fri 5, Wed 5 and Sun 2, and the five Wednesday midweek rounds
  # (GW13, 18, 20, 25, 28) have no Friday between the previous deadline and
  # their own - so those five gameweeks got NO run at all and would have gone in
  # with a stale squad and lineup. Other gameweeks fired up to three times, once
  # with a lead of 362 hours.
  schedule:
    - cron: '0 10 * * *'
  # Manual trigger still available for testing
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no changes submitted to FPL)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  manage-team:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Printed on every run because the model's output depends on these more
      # than it looks: a pandas major bump silently changed how a text column
      # reports its dtype and halved the squad's expected points.
      - name: Record resolved versions
        run: pip list --format=freeze | grep -iE '^(pandas|numpy|scipy|requests|pynacl)=='

      # The historical dataset the xP model builds its priors from is
      # gitignored (12MB, reproducible), so a fresh checkout has none. Without
      # this step every per-90 rate falls back to zero and the run would submit
      # a squad chosen by nothing. manager.py refuses to run on empty priors,
      # so a fetch failure surfaces as a failed run rather than a bad team.
      - name: Cache historical dataset
        uses: actions/cache@v4
        with:
          path: data/history
          key: fpl-history-${{ hashFiles('fetch_data.py') }}-v1

      - name: Fetch priors and snapshot live data
        run: python fetch_data.py

      - name: Run FPL Auto Manager
        env:
          FPL_EMAIL: ${{ secrets.FPL_EMAIL }}
          FPL_PASSWORD: ${{ secrets.FPL_PASSWORD }}
          FPL_TEAM_ID: ${{ secrets.FPL_TEAM_ID }}
          FPL_COOKIE: ${{ secrets.FPL_COOKIE }}
          FPL_REFRESH_TOKEN: ${{ secrets.FPL_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          # --respect-window only on the schedule. The cron fires daily and
          # manager.py decides whether today is the day; a manual dispatch is a
          # deliberate act and must run whenever it is asked to.
          WINDOW=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            WINDOW="--respect-window"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python manager.py --dry-run $WINDOW
          else
            python manager.py $WINDOW
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpl-run-logs-${{ github.run_number }}
          path: fpl_run_*.log
          retention-days: 30
